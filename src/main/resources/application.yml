spring:
  application:
    name: payflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: snappy
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payflow-notifier}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        max.poll.records: 100
    listener:
      ack-mode: record
    admin:
      fail-fast: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: payflow

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-no-request}] %logger{36} - %msg%n"
  level:
    com.petproject.payflow: INFO
    org.apache.kafka: WARN

app:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: 1000
    initial-delay-ms: 2000
    batch-size: 50
    max-attempts: 10
    send-timeout-ms: 5000
  kafka:
    transfer-topic: payments.transfer.events
    transfer-partitions: 3
  cache:
    account-ttl: 10m
  idempotency:
    result-ttl: 24h
    lock-ttl: 30s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    transfers-per-minute: 30
